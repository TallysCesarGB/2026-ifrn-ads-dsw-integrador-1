{% load icons %}

<nav class="navbar">
  <a href="{% url 'posts:feed' %}" class="brand">{% icon "clapperboard" %}CineClub</a>
  <div class="navbar-actions">
    <a href="{% url 'posts:feed' %}"
       class="nav-btn nav-feed {% if request.resolver_match.url_name == 'feed' %}active{% endif %}">Feed</a>
    <a href="{% url 'posts:new_post' %}"
       class="btn-gold"
       aria-label="Indicar filme">+<span class="nav-label"> Indicar</span></a>
    <a href="{% url 'accounts:profile' username=user.username %}">
      <img src="{{ user.profile.avatar_url }}" alt="avatar" class="avatar-nav" />
    </a>
    <form method="post"
          action="{% url 'accounts:logout' %}"
          style="display:inline">
      {% csrf_token %}
      <button type="submit"
              class="logout-btn icon-btn"
              title="Sair"
              aria-label="Sair">{% icon "log-out" %}</button>
    </form>
  </div>
</nav>
