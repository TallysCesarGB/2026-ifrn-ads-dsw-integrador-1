name: CI

# Enable Buildkit and let compose use it to speed up image building
env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

on:
  pull_request:
    branches: ['main', 'develop']
    paths-ignore: ['docs/**']

  push:
    branches: ['main', 'develop']
    paths-ignore: ['docs/**']

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  linter:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Corrige automaticamente só em PRs de branches deste repositório
      # (forks não aceitam push e o token do Dependabot é somente leitura).
      AUTOFIX: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7
        with:
          # Em PR, faz checkout da branch (não do merge commit) para poder dar push.
          ref: ${{ env.AUTOFIX == 'true' && github.head_ref || '' }}
          # Push com o GITHUB_TOKEN não dispara um novo CI; com o secret
          # AUTOFIX_TOKEN (PAT com permissão de contents) o commit de correção
          # também é testado.
          token: ${{ secrets.AUTOFIX_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Cache pre-commit environments
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Auto-fix and push
        if: env.AUTOFIX == 'true'
        run: |
          # Duas passadas: ruff format e ruff --fix às vezes mexem um depois do outro.
          pre-commit run --all-files || pre-commit run --all-files || true
          if git diff --quiet; then
            echo "Nada para corrigir."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "style: correções automáticas do pre-commit"
          git push

      # Falha se sobrar algo que só se corrige à mão (ou, fora de PR, qualquer erro).
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  # With no caching at all the entire ci process takes 3m to complete!
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      # When keep_local_envs_in_vcs is off, .envs/.local/* are not in the repo.
      # Create minimal dummy files so Docker Compose / Django / Postgres work in CI.
      - name: Ensure local env files exist for Docker Compose
        run: |
          mkdir -p .envs/.local
          if [ ! -f .envs/.local/.django ]; then
            cat <<'EOF' > .envs/.local/.django
          USE_DOCKER=yes
          IPYTHONDIR=/app/.ipython
          EOF
          fi
          if [ ! -f .envs/.local/.postgres ]; then
            cat <<'EOF' > .envs/.local/.postgres
          POSTGRES_HOST=postgres
          POSTGRES_PORT=5432
          POSTGRES_DB=ci
          POSTGRES_USER=debug
          POSTGRES_PASSWORD=debug
          EOF
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and cache local backend
        uses: docker/bake-action@v7
        with:
          push: false
          load: true
          files: docker-compose.local.yml
          targets: django
          set: |
            django.cache-from=type=gha,scope=django-cached-tests
            django.cache-to=type=gha,scope=django-cached-tests,mode=max
            postgres.cache-from=type=gha,scope=postgres-cached-tests
            postgres.cache-to=type=gha,scope=postgres-cached-tests,mode=max

      - name: Build and cache docs
        uses: docker/bake-action@v7
        with:
          push: false
          load: true
          files: docker-compose.docs.yml
          set: |
            docs.cache-from=type=gha,scope=cached-docs
            docs.cache-to=type=gha,scope=cached-docs,mode=max

      - name: Check DB Migrations
        run: docker compose -f docker-compose.local.yml run --rm django python manage.py makemigrations --check

      - name: Run DB Migrations
        run: docker compose -f docker-compose.local.yml run --rm django python manage.py migrate

      - name: Run Django Tests
        run: docker compose -f docker-compose.local.yml run django pytest

      - name: Tear down the Stack
        run: docker compose -f docker-compose.local.yml down
